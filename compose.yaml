services:
  relay:
    build: ./relay
    restart: unless-stopped
    env_file: .env                  # CLAUDE_VOICE_TOKEN(S); never commit .env
    volumes:
      - ./relay/relay.toml:/config/relay.toml:ro
    ports:
      - "127.0.0.1:8787:8787"       # expose via Pangolin/reverse proxy with TLS, not directly
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
