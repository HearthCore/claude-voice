services:
  relay:
    build: ./relay
    image: claude-voice-relay:local
    container_name: claude-voice-relay
    restart: unless-stopped
    env_file: .env                  # CLAUDE_VOICE_TOKEN(S), CLAUDE_VOICE_BASE_PATH, RELAY_BIND; never commit .env
    volumes:
      - ./relay/relay.toml:/config/relay.toml:ro
    ports:
      - "${RELAY_BIND:-127.0.0.1}:8787:8787"   # expose via Pangolin/reverse proxy with TLS, not directly
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
